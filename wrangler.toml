name = "flydrate-flight-api"
main = "worker.js"
compatibility_date = "2026-08-15"
workers_dev = true
account_id = "6a7db9d9cd1c4fbf89ceca52984a7ac3"

# Early-warning cron (UTC). Requires redeploy after edits.
[triggers]
crons = ["*/15 * * * *"]

# Create KV once: `npx wrangler kv namespace create ALERT_STATE`
# Then paste the id below and redeploy.
# [[kv_namespaces]]
# binding = "ALERT_STATE"
# id = "YOUR_KV_NAMESPACE_ID"

[vars]
RAPIDAPI_HOST = "aerodatabox.p.rapidapi.com"
ALERT_BOARD_URL = "https://laurencenairprice.github.io/flydratelive/uk-delays.html"
ALERT_EMAIL_TO = "laurence@flydrate.co.uk,kay@flydrate.co.uk"
ALERT_EMAIL_FROM = "Flydrate Alerts <alerts@flydrate.co.uk>"

